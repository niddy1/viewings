<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- preview: make-pages.py writes this block -->
  <title>Viewings</title>
  <meta name="description" content="The 71 films I watched in 2026, shelved as VHS tapes.">
  <meta property="og:site_name" content="Viewings">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Viewings">
  <meta property="og:description" content="The 71 films I watched in 2026, shelved as VHS tapes.">
  <meta property="og:url" content="https://ianandreu.com/viewings/">
  <meta property="og:image" content="https://ianandreu.com/viewings/share/2026.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://ianandreu.com/viewings/">
  <!-- /preview -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Barlow+Condensed:wght@500;600&family=Anton&family=Bebas+Neue&family=Bungee&family=Cinzel:wght@700&family=Creepster&family=Monoton&family=Orbitron:wght@900&family=Oswald:wght@700&family=Permanent+Marker&family=Pirata+One&family=Playfair+Display:wght@900&family=Righteous&family=Rubik+Mono+One&family=Rye&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="ticket-row">
      <!-- step to the year before / after; app.js fills these in and hides the one with nowhere to go -->
      <a class="shelf-arrow prev" id="shelf-prev" hidden><svg viewBox="0 0 40 48" aria-hidden="true"><path d="M30 4 8 24l22 20"/></svg><span class="yr"></span></a>
      <h1 class="ticket"><img src="watched-2026.png" alt="Watched 2026" width="900" height="561"><span class="vh">Viewings <span id="year">2026</span></span></h1>
      <a class="shelf-arrow next" id="shelf-next" hidden><span class="yr"></span><svg viewBox="0 0 40 48" aria-hidden="true"><path d="M10 4l22 20-22 20"/></svg></a>
    </div>
    <div class="controls" id="controls" hidden>
      <div class="sort" role="group" aria-label="Sort the shelf">
        <span class="label">Sort</span>
        <button type="button" data-sort="watched">Date watched</button>
        <button type="button" data-sort="rating">My rating</button>
        <button type="button" data-sort="imdb">IMDb</button>
        <button type="button" data-sort="year">Year</button>
      </div>
      <div class="genre-pick">
        <button type="button" id="genre-btn" aria-expanded="false" aria-controls="genre-list"><span class="label">Genre</span> <span id="genre-sel">All</span> <span class="caret">&#9662;</span></button>
        <div class="genre-list" id="genre-list" hidden></div>
      </div>
    </div>
    <!-- the whole store: search every shelf, or a random tape (app.js, "the whole store") -->
    <div class="finder" id="finder" role="group" aria-label="The whole store" hidden>
      <button type="button" id="find-btn" title="Search every shelf (press /)"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4.5 4.5"/></svg>Find a tape</button>
      <button type="button" id="lucky-btn" title="A random tape from any shelf">Surprise me</button>
    </div>
    <p class="tally" hidden><span id="count">0</span> <span id="tapes">Tapes</span></p>
  </header>

  <div class="room">
    <!-- framed posters on the wall either side of the case; desktop only -->
    <figure class="wall-poster left" aria-hidden="true">
      <img src="wall/anatomy-of-a-murder-1959.jpg" alt="" width="448" height="674" loading="lazy">
    </figure>
    <main id="shelves" aria-label="Shelf of watched films">
      <!-- shown until app.js stocks the shelf (layout() clears it) -->
      <div class="loading"><img src="loading.webp" alt="" width="500" height="270" fetchpriority="high"><p>Stocking the shelf...</p></div>
    </main>
    <figure class="wall-poster right" aria-hidden="true">
      <img src="wall/bande-a-part-1964.jpg" alt="" width="620" height="888" loading="lazy">
    </figure>
  </div>

  <footer class="credit">
    <p>Film data and posters from <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>. This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
  </footer>

  <div class="viewer" id="viewer" aria-hidden="true">
    <div class="backdrop" id="backdrop"></div>
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="v-title">
      <button class="nav prev" id="prev" aria-label="Previous tape">&#8249;</button>
      <div class="stage">
        <a class="cover" id="cover" target="_blank" rel="noopener">
          <span class="hint">Open on IMDb &#8599;</span>
        </a>
      </div>
      <button class="nav next" id="next" aria-label="Next tape">&#8250;</button>

      <section class="info">
        <h2 id="v-title"></h2>
        <p class="facts" id="v-facts"></p>
        <div class="rating" id="v-rating"></div>
        <p class="imdb-score" id="v-imdb"></p>
        <p class="watched" id="v-watched"></p>
        <div class="genres" id="v-genres"></div>
        <p class="note" id="v-note"></p>
        <button class="close" id="close">Put it back</button>
      </section>
    </div>
  </div>

  <!-- the store directory: every shelf, and a search across all of them (app.js; click the ticket, "Find a tape" or press /) -->
  <div class="store" id="store" hidden>
    <div class="store-backdrop" data-close></div>
    <div class="store-box" role="dialog" aria-modal="true" aria-labelledby="store-h">
      <div class="store-head">
        <h2 id="store-h"><span>Store</span> <span>Directory</span></h2>
        <p id="store-total"></p>
        <button type="button" class="store-x" data-close aria-label="Close">&times;</button>
      </div>
      <label class="store-search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4.5 4.5"/></svg>
        <span class="vh">Find a tape</span>
        <input id="store-q" type="search" placeholder="Title, director or year" autocomplete="off" autocapitalize="off" spellcheck="false" role="combobox" aria-controls="store-results" aria-expanded="false">
      </label>
      <div class="store-results" id="store-results" role="listbox" aria-label="Tapes found" hidden></div>
      <div class="store-aisles" id="store-aisles">
        <section class="aisle-all" id="aisle-all"></section>
        <section><h3>The Vault <small>by decade of release</small></h3><div class="aisle" id="aisle-vault"></div></section>
        <section><h3>Year shelves <small>by year watched</small></h3><div class="aisle" id="aisle-years"></div></section>
      </div>
      <div class="store-foot">
        <button type="button" id="store-lucky">Surprise me</button>
        <span class="keys"><kbd>/</kbd> find <kbd>[</kbd><kbd>]</kbd> next shelf <kbd>Esc</kbd> close</span>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="vcr.js"></script>
</body>
</html>
